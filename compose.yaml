services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c 'if [ ! -x node_modules/.bin/vite ]; then npm ci || exit 1; fi; exec npm run dev -- --host 0.0.0.0'

volumes:
  portfolio_node_modules: