services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0

volumes:
  portfolio_node_modules: